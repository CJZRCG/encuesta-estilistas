<style>
[hidden]{display:none!important}
/* Layout: asistente móvil de una pregunta por pantalla, fondo crema, barra de avance arriba y botones fijos abajo (al alcance del pulgar) */
:root{
  --bg:#FBF4DF; --surface:#FFFDF6; --ink:#2A2118; --muted:#6B5F4E; --line:#E9DDBF; --ex:#F5EBCF;
  --accent:#1F4A7A; --accent-ink:#FFFFFF; --accent-soft:#E2E9F2; --accent-deep:#14365C;
  --ok:#1E7A4C; --ok-soft:#E6F2DF; --no:#B42A20; --no-soft:#F9E3DA; --off:#B8AC94;
  --display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,-apple-system,sans-serif;
  --r:16px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;-webkit-font-smoothing:antialiased;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
h1,h2,h3{font-family:var(--display);font-weight:700;letter-spacing:-0.015em;text-wrap:balance;margin:0;line-height:1.12}
h1{font-size:clamp(2rem,8vw,2.6rem)}
h2{font-size:clamp(1.35rem,5.4vw,1.7rem)}
h3{font-size:1.2rem}
p{margin:0}
.muted{color:var(--muted)}
.tag{align-self:flex-start;font-size:.78rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}

/* Barra de avance */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px;display:flex;flex-direction:column;gap:8px}
.top-txt{display:flex;justify-content:space-between;gap:12px;font-size:.88rem;color:var(--muted);font-variant-numeric:tabular-nums}
.top-txt b{color:var(--ink)}
.track{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}

.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 130px}
.screen{display:flex;flex-direction:column;gap:18px}

/* Portada: notificaciones del asistente */
.phone{background:var(--ink);border-radius:26px;padding:14px 12px 16px;display:flex;flex-direction:column;gap:8px;box-shadow:0 10px 30px rgba(42,33,24,.18)}
.phone .clock{color:#F5EBCF;text-align:center;font-family:var(--display);font-size:1.9rem;line-height:1;margin:2px 0 6px;font-variant-numeric:tabular-nums}
.phone .day{color:#CDBF9F;text-align:center;font-size:.78rem;margin-top:-4px;margin-bottom:6px}
.noti{background:rgba(255,253,246,.94);border-radius:14px;padding:9px 12px;display:flex;gap:10px;align-items:flex-start;animation:in .5s ease both}
.noti:nth-of-type(2){animation-delay:.35s} .noti:nth-of-type(3){animation-delay:.7s}
@keyframes in{from{transform:translateY(8px);opacity:.2}to{transform:none;opacity:1}}
.noti .av{flex:none;width:30px;height:30px;border-radius:9px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
.noti .av svg{width:17px;height:17px}
.noti div{min-width:0;font-size:.88rem;line-height:1.35;color:var(--ink)}
.noti small{display:flex;justify-content:space-between;gap:8px;font-size:.72rem;color:var(--muted);font-weight:600}
.noti b{color:var(--ok)}
.founder{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px}
.founder .sig{font-size:.88rem;color:var(--muted);font-weight:600}
.gets{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.gets li{display:flex;gap:12px;align-items:flex-start}
.gets .ic{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
.gets .ic svg{width:19px;height:19px}
.gets b{display:block}
.gets span.t{color:var(--muted);font-size:.95rem}
.note{font-size:.88rem;color:var(--muted);text-align:center}

/* Píldora: beneficio de la función detrás de cada pregunta */
.pildora{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.cap{flex:none;width:34px;height:16px;margin-top:4px;border-radius:99px;background:linear-gradient(90deg,var(--accent) 50%,var(--ex) 50%);border:1.5px solid var(--accent);transform:rotate(-30deg)}
.pildora div{min-width:0;font-size:.95rem;line-height:1.4}
.pildora i{font-style:normal;display:block;font-size:.7rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-bottom:1px}

/* Opciones */
.hint{color:var(--muted);font-size:.93rem;margin-top:-8px}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:12px;width:100%;min-height:56px;text-align:left;background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 16px;font:500 1rem/1.35 var(--body);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.opt .box{flex:none;width:22px;height:22px;border:2px solid #CDBF9F;border-radius:50%;display:grid;place-items:center}
.opt.multi .box{border-radius:7px}
.opt[aria-checked="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt[aria-checked="true"] .box{border-color:var(--accent);background:var(--accent)}
.opt[aria-checked="true"] .box::after{content:"";width:9px;height:9px;border-radius:2px;background:var(--accent-ink)}
.opt[aria-disabled="true"]{opacity:.45}
.opt small{display:block;color:var(--muted);font-size:.85rem;font-weight:400}

/* Tarjetas de función */
.cards{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:10px;transition:border-color .15s}
.card.rated{border-color:var(--accent)}
.card b{font-size:1.04rem;line-height:1.3}
.fn{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.ex{display:block;background:var(--ex);border-radius:4px 12px 12px 12px;padding:8px 11px;font-size:.93rem;line-height:1.4}
.ex i{font-style:normal;font-size:.7rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ok);display:block;margin-bottom:1px}
.pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pill{font:600 .84rem/1.2 var(--body);min-height:48px;padding:6px 4px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.pill[aria-checked="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pill.no[aria-checked="true"]{background:var(--no);border-color:var(--no)}
.pill.pay[aria-checked="true"]{background:var(--ok);border-color:var(--ok)}

/* Asistente */
.chat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:8px}
.bub{max-width:85%;padding:8px 12px;border-radius:14px;font-size:.95rem;line-height:1.4}
.bub.me{align-self:flex-end;background:var(--accent);color:var(--accent-ink);border-bottom-right-radius:4px}
.bub.ai{align-self:flex-start;background:var(--ex);border-bottom-left-radius:4px}
.bub small{display:block;font-size:.7rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;opacity:.75}

/* Planes */
.tools{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.tool{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:2px}
.tool b{font-size:.95rem}
.tool span{font-size:.82rem;color:var(--muted);line-height:1.3}
.rules{display:flex;flex-wrap:wrap;gap:6px}
.rules span{font-size:.82rem;font-weight:600;background:var(--ok-soft);color:var(--ok);border-radius:999px;padding:4px 10px}
.prices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.pc{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:1px}
.pc.mid{border-color:var(--accent)}
.pc b{font-size:.95rem}
.pc .pr{font-family:var(--display);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;color:var(--accent)}
.pc small{color:var(--muted);font-size:.76rem;line-height:1.25}
.tbl{overflow-x:auto;background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r)}
.cmp{width:100%;border-collapse:collapse;font-size:.86rem}
.cmp th,.cmp td{padding:8px 5px;border-bottom:1px solid var(--line);text-align:center;vertical-align:middle}
.cmp td.fname{text-align:left;padding-left:12px;font-weight:500;min-width:128px}
.cmp tr.sec th{background:var(--ex);font-size:.76rem;font-weight:700;text-align:center;position:sticky;top:0}
.cmp tr.sec th:first-child{text-align:left;padding-left:12px;font-size:.84rem}
.cmp td.yes{color:var(--ok);font-weight:700;font-size:1.05rem}
.cmp td.off{color:var(--off)}
.cmp td.txt{font-size:.76rem;line-height:1.25}
.cmp tr:last-child td{border-bottom:0}
.legend{font-size:.84rem;color:var(--muted)}
.legend .yes{color:var(--ok);font-weight:700} .legend .off{color:var(--off)}

/* Llamado a unirse */
.join{background:var(--accent-deep);color:#FFFFFF;border-radius:22px;padding:22px 18px;display:flex;flex-direction:column;gap:14px}
.join .tag{color:#B9CCE4}
.join h2{color:#FFFFFF;font-size:clamp(1.7rem,7vw,2.1rem)}
.join p{color:#D5E0EE}
.perks{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.perks li{display:flex;gap:10px;align-items:flex-start;color:#FFFFFF;font-size:.97rem;line-height:1.4}
.perks .ck{flex:none;width:24px;height:24px;border-radius:50%;background:#FFFFFF;color:var(--accent-deep);display:grid;place-items:center;margin-top:1px}
.perks .ck svg{width:14px;height:14px}
.skip{font:inherit;font-size:.95rem;font-weight:600;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;align-self:center;padding:8px}

/* Campos */
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600}
.field label span{color:var(--muted);font-weight:400}
input[type=tel],input[type=text],input[type=email]{font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:13px 14px;width:100%}
input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;color:var(--muted)}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none;margin-top:1px}
.err{color:var(--no);font-size:.9rem;font-weight:600}

/* Final */
.done-h{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding-top:12px}
.mark{width:68px;height:68px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.mark svg{width:32px;height:32px}
.calc{background:var(--surface);border:1.5px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:6px}
.calc .k{font-size:.74rem;font-weight:700;letter-spacing:.07em;text-transform:uppercase;color:var(--accent)}
.calc .big{font-family:var(--display);font-weight:700;font-size:clamp(1.6rem,7vw,2rem);font-variant-numeric:tabular-nums;color:var(--no);line-height:1.15}
.calc small{color:var(--muted);font-size:.86rem}
.share{background:var(--accent-soft);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.share-btns{display:flex;flex-direction:column;gap:8px}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;gap:8px}
.btn-wa{background:#1E7A4C;color:#FFFFFF}
.btn-wa svg{width:20px;height:20px}

/* Navegación inferior */
.nav{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:6;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.nav-in{max-width:600px;margin:0 auto;display:flex;gap:10px;align-items:center}
.btn{flex:1;font:inherit;font-weight:700;border:0;border-radius:999px;min-height:54px;padding:0 24px;cursor:pointer;background:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-line{background:var(--surface);color:var(--ink);border:1.5px solid var(--line)}
.back{flex:none;background:none;border:0;font:inherit;font-weight:600;color:var(--muted);padding:0 10px;min-height:54px;cursor:pointer}
.btn:focus-visible,.opt:focus-visible,.pill:focus-visible,.back:focus-visible,.skip:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.hp{position:absolute;left:-10000px;width:1px;height:1px;overflow:hidden}
@media (prefers-reduced-motion: reduce){ .track i,.opt,.card{transition:none} .noti{animation:none} }
</style>
</head>

<script>
/* ===== Configuración =====
   ENDPOINT: URL /exec del Apps Script. Vacía = vista previa (no guarda nada).
   SHARE_URL: enlace público de la encuesta que se comparte con colegas. */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxghT58SFYvwWtpGI5a5aA3rd1C0Is0Wjg5mFD8GpqkSn7lPfPLrHAGAMA_fGGNsRnYkg/exec";

const SECS = ["Tu trabajo","Tu día a día","Funciones","Tu asistente","Planes","Para terminar"];

const shuffle = a=>{ const b=[...a]; for(let i=b.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [b[i],b[j]]=[b[j],b[i]]; } return b; };
const money = n=>"$"+n.toLocaleString("es-CO");

/* Funciones a calificar: nombre y beneficio para el estilista */
const F1 = shuffle([
 ["f_asistente","Asistente que agenda por ti","Tus clientes reservan escribiendo o con una nota de voz, a cualquier hora, sin que dejes de atender. No pierdes reservas por responder tarde."],
 ["f_pagina","Tu página con precios y botón Reservar","Tienes un enlace propio para tu Instagram y tu WhatsApp donde ven tus trabajos y tus precios, y reservan solos. Te ves más profesional."],

 ["f_buscador","Aparecer en el buscador","Personas de tu zona que buscan tu especialidad te encuentran aunque no te conozcan. Clientes nuevos sin pagar publicidad."],
 ["f_confianza","Identidad verificada y opiniones reales","Un sello de identidad y opiniones de clientes con cita real le dan confianza a quien todavía no te conoce. Más reservas de clientes nuevos."]
]);
const F2 = shuffle([
 ["f_volver","Clientes por volver","Te avisa a qué cliente le toca volver, según cada cuánto viene, con el mensaje listo para enviar. Recuperas citas que se te pasaban."],

const FALL = F1.concat(F2);
const FUT = [["t_tienda","Tienda de productos","Pides tus insumos desde la plataforma y te llegan sin salir a comprar."],["t_salones","Vacantes y sillas en salones","Encuentras sillas en arriendo y vacantes en salones de tu zona."],["t_credito","Crédito con una entidad aliada","Accedes a crédito para equipos usando tu historial de trabajo en la plataforma."]];

/* Qué incluye cada plan (Presencia, Pro, Élite). "✓" incluido, "" no incluido, texto = alcance */
const PLANS = [{n:"Presencia",p:30000},{n:"Pro",p:50000},{n:"Élite",p:70000}];
const CMP = [
 ["Tu asistente",[
  ["Agenda por ti, por texto o voz",["✓","✓","✓"]],

 ["Atrae clientes",[

  ["Tus redes conectadas",["✓","✓","✓"]],
  ["Menú de servicios con fotos",["Hasta 10","Ilimitado","Ilimitado"]],

 ["Confianza",[

function answered(s){
  const v = A[s.id];
  if(s.type==="multi") return Array.isArray(v) && v.length>0;
  if(s.type==="rate") return !!v && s.part.every(f=>v[f[0]]);
  if(s.type==="future") return !!v && FUT.every(f=>v[f[0]]);
  if(s.type==="join") return mailOk(A.correo) && telOk(A.tel||"") && !!A.autoriza;

}

function render(){
  const nav = $("#next"), back = $("#back");
  if(cur<0){ $("#view").innerHTML = intro(); $("#top").hidden = true; back.hidden = true; nav.disabled = false; nav.textContent = "Quiero ser parte"; return; }
  const list = visible(), s = list[cur];
  $("#top").hidden = false; back.hidden = false;
  $("#topSec").textContent = SECS[s.sec];
  $("#topN").textContent = cur+1; $("#topT").textContent = list.length;
  $("#topBar").style.width = ((cur+1)/list.length*100)+"%";
  let h = "";
  if(s.type==="single" || s.type==="multi") h = pill(s) + head(s) + optsHTML(s);
  else if(s.type==="rate") h = `<span class="tag">${s.part===F1?"Funciones 1 de 2":"Funciones 2 de 2"}</span>` + head(s) + pill(s) + rateHTML(s);
  else if(s.type==="assistant") h = assistantHTML(s);
  else if(s.type==="plans") h = plansHTML(s);
  else if(s.type==="future") h = pill(s) + futureHTML(s);
  else if(s.type==="join") h = joinHTML();
  $("#view").innerHTML = `<section class="screen">${h}<p class="err" id="err" hidden></p></section>`;
  const last = cur===list.length-1;
  nav.textContent = s.type==="join" ? "Unirme a la lista" : (last && answered(s) ? "Enviar" : "Continuar");
  nav.disabled = !answered(s);
  if(s.type==="join") bindJoin(s);
}

function bindJoin(s){
  const m=$("#correo"), nm=$("#nombre"), tel=$("#tel"), loc=$("#loc"), au=$("#autoriza");
  const upd=()=>{ A.correo = m.value.trim().slice(0,80); A.nombre_pagina = nm.value.trim().slice(0,40);
    A.tel = tel.value.replace(/[^\d ]/g,"").trim(); if(tel.value!==A.tel) tel.value=A.tel;
    A.loc = loc.value.slice(0,60).trim(); A.autoriza = au.checked;
    $("#telErr").hidden = telOk(A.tel); $("#mailErr").hidden = !A.correo || mailOk(A.correo) || document.activeElement===m;
    $("#next").disabled = !answered(s); };
  [m,nm,tel,loc].forEach(i=>i.oninput=upd); au.onchange=upd; m.onblur=upd;
  $("#skip").onclick = ()=>{ A.unido = false; submit("normal"); };
}

document.addEventListener("click", e=>{
  if(cur<0) return;
  const s = visible()[cur];
  if(!s) return;
  const o = e.target.closest(".opt");
  if(o){ if(o.getAttribute("aria-disabled")==="true") return;
    const step = s.type==="assistant" ? ASK_HABLAR : s;
    const label = optsOf(step)[+o.dataset.o];
    if(step.type==="multi"){
      let v = A[step.id]||[];
      if(v.includes(label)) v = v.filter(x=>x!==label);
      else if(label===step.excl) v = [label];
      else { v = v.filter(x=>x!==step.excl); if(!step.max || v.length<step.max) v = [...v,label]; }
      A[step.id] = v;
    } else A[step.id] = label;
    keepScroll(); return; }
  const r = e.target.closest("[data-r]");
  if(r){ A[s.id] = A[s.id]||{}; A[s.id][r.dataset.r] = RATE[+r.dataset.c]; keepScroll(); return; }
  const u = e.target.closest("[data-u]");
  if(u){ A[s.id] = A[s.id]||{}; A[s.id][u.dataset.u] = FUTC[+u.dataset.c]; keepScroll(); return; }
});

function go(d){
  if(cur<0){ T0 = Date.now(); cur = 0; render(); window.scrollTo({top:0}); return; }
  const list = visible(), s = list[cur];
  if(d>0){
    if(!answered(s)){ const e=$("#err"); e.textContent = s.type==="rate"||s.type==="future" ? "Te falta calificar alguna. Revisa las que no tienen opción marcada." : s.type==="join" ? "Escribe tu correo y marca la autorización para unirte." : "Elige una opción para seguir."; e.hidden=false; return; }
    if(s.type==="join"){ A.unido = true; submit("normal"); return; }
    const end = s.endIf && s.endIf(A); if(end){ submit(end); return; }
    const nl = visible(), idx = nl.indexOf(s);
    if(idx===nl.length-1){ submit("normal"); return; }
    cur = idx+1;
  } else cur = cur-1;
  render(); window.scrollTo({top:0});
}

$("#next").addEventListener("click", ()=>go(1));
$("#back").addEventListener("click", ()=>go(-1));

/* ===== Envío ===== */
function payload(kind){
  const f = A.q_f||{}, u = A.q_futuro||{}, row = {
    v:VERSION, sid:SID, fecha:new Date().toISOString(), t_seg:T0?Math.round((Date.now()-T0)/1000):0, hp:$("#website").value||"",
    origen:(new URLSearchParams(location.search).get("src")||"").slice(0,40), resultado:kind,
    trabajo:A.q_trabajo||"", especialidad:A.q_especialidad||"", clientes_recurrentes:A.q_clientes||"", precio_servicio:A.q_precio_servicio||"",
    clientes_nuevos:(A.q_nuevos||[]).join(" | "), agenda_hoy:A.q_agenda||"", citas_falladas:A.q_fallan||"", control_ingresos:A.q_cuentas||"", frenos:(A.q_frenos||[]).join(" | ")
  };
  FALL.forEach(([id])=>row[id]=f[id]||"");
  Object.assign(row, {mas_importante:A.q_top||"", asistente_hablar:A.q_hablar||"", asistente_limite:A.q_limite||"", intencion:A.q_intencion||"", barrera:A.q_barrera||"",
    plan:A.q_plan||"", precio_plan:A.q_precio_plan||"", precio_max:A.q_precio_max||""});
  FUT.forEach(([id])=>row[id]=u[id]||"");
  const ok = !!A.unido && !!A.autoriza;
  Object.assign(row, {lista_primeros:ok?"Sí":"No", correo:ok?A.correo||"":"", nombre_pagina:ok?A.nombre_pagina||"":"", whatsapp:ok?(A.tel||"").replace(/\D/g,""):"", localidad:ok?A.loc||"":"", autoriza:ok?"Sí":"No"});
  return row;
}

async function submit(kind){
  const btn = $("#next"), row = payload(kind);
  if(row.hp){ finish(kind); return; }
  if(ENDPOINT){
    btn.disabled = true; btn.textContent = "Enviando…";
    try{ await fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(row)}); store.set(); }
    catch(e){ const er=$("#err"); er.textContent="No pudimos enviar tus respuestas. Revisa tu conexión e inténtalo de nuevo."; er.hidden=false; btn.disabled=false; btn.textContent="Enviar"; return; }
  }
  finish(kind);
}

function calc(){
  const k = O6.indexOf(A.q_fallan);
  if(k===0) return `<span class="k">Tu cifra</span><p>Casi no te fallan citas. Esa constancia de tus clientes es plata que <b>sí estás ganando</b>.</p>`;
  if(k===4) return `<span class="k">Tu cifra</span><p>Atiendes por orden de llegada: no pierdes citas, pero cada hora con la silla vacía también es plata que no entra.</p>`;
  if(k<1) return "";
  const t = [15000,27000,45000,60000][O4.indexOf(A.q_precio_servicio)] || 27000;
  const r = [[1,3],[4,7],[8,null]][k-1];
  const fig = r[1] ? `Entre ${money(r[0]*t)} y ${money(r[1]*t)}` : `${money(r[0]*t)} o más`;
  return `<span class="k">Tu cifra</span><p>Las citas que no llegan te podrían estar costando al mes:</p><span class="big">${fig}</span>
    <small>Calculado con tus respuestas: ${r[1]?`de ${r[0]} a ${r[1]}`:`${r[0]} o más`} citas falladas al mes × un servicio de cerca de ${money(t)}.</small>`;
}

function shareHTML(){
  const msg = `Estoy ayudando a crear una herramienta para estilistas. Responde en 5 minutos y ayuda a decidir qué funciones tendrá: ${SHARE_URL}?src=colega`;
  return `<div class="share"><h3>¿Conoces a un colega que debería ver esto?</h3>
    <p class="muted">Compártele la encuesta. Entre más estilistas respondan, mejor queda la herramienta para todos.</p>
    <div class="share-btns">
      <a class="btn btn-wa" href="https://wa.me/?text=${encodeURIComponent(msg)}" target="_blank" rel="noopener">${WA}Compartir por WhatsApp</a>
      <button class="btn btn-line" id="copy" type="button">Copiar enlace</button>
    </div>
    <p class="muted" id="copyMsg" role="status" style="font-size:.88rem"></p></div>`;
}

function finish(kind){
  $("#top").hidden = true; $("#nav").hidden = true;
  let title, msg;
  if(kind==="screen"){ title = "Gracias por tu interés"; msg = "Esta encuesta es para estilistas en ejercicio. Si conoces a alguien que lo sea, compártela."; }
  else if(kind==="low"){ title = "Gracias por tu tiempo"; msg = "Tu opinión nos ayuda a construir algo que de verdad sirva."; }
  else if(A.unido){ title = "¡Ya estás en la lista!"; msg = `Te escribiremos a ${A.correo} cuando lancemos la versión web inicial.`; }
  else { title = "¡Gracias por responder!"; msg = "Tus respuestas ya cuentan para decidir qué se construye primero."; }
  $("#view").innerHTML = `<section class="screen"><div class="done-h"><div class="mark">${CHECK}</div><h2>${esc(title)}</h2><p class="lead muted">${esc(msg)}</p></div>
    ${shareHTML()}</section>`;
  $("#copy").onclick = async ()=>{ const m=$("#copyMsg"); try{ await navigator.clipboard.writeText(SHARE_URL+"?src=colega"); m.textContent="Enlace copiado. Pégalo en tu chat."; }catch(e){ m.textContent = "Copia este enlace: "+SHARE_URL; } };
  window.scrollTo({top:0});
}

function already(){
  $("#nav").hidden = true;
  $("#view").innerHTML = `<section class="screen"><div class="done-h"><div class="mark">${CHECK}</div><h2>Ya registramos una respuesta desde este celular</h2>
    <p class="lead muted">Gracias por participar. Si eres otro estilista y usas este mismo celular, puedes responder de nuevo.</p></div>
    <button class="btn btn-line" id="again" type="button">Soy otro estilista y quiero responder</button>${shareHTML()}</section>`;
  $("#again").onclick = ()=>{ store.clear(); location.reload(); };
  $("#copy").onclick = async ()=>{ const m=$("#copyMsg"); try{ await navigator.clipboard.writeText(SHARE_URL+"?src=colega"); m.textContent="Enlace copiado. Pégalo en tu chat."; }catch(e){ m.textContent = "Copia este enlace: "+SHARE_URL; } };
}

if(store.get()) already(); else render();
</script>
